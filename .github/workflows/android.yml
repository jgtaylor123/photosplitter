name: Build Android APK

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - name: Install Android SDK platform
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore permanent signing key
        shell: bash
        env:
          SIGNING_KEY_BASE64: ${{ secrets.PHOTOSPLITTER_KEYSTORE_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.PHOTOSPLITTER_KEYSTORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_BASE64" || { echo "::error::Set PHOTOSPLITTER_KEYSTORE_BASE64 in repository Actions secrets"; exit 1; }
          test -n "$SIGNING_PASSWORD" || { echo "::error::Set PHOTOSPLITTER_KEYSTORE_PASSWORD in repository Actions secrets"; exit 1; }
          echo "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/photosplitter.jks"
          echo "PHOTOSPLITTER_KEYSTORE_PATH=$RUNNER_TEMP/photosplitter.jks" >> "$GITHUB_ENV"
          echo "PHOTOSPLITTER_KEYSTORE_PASSWORD=$SIGNING_PASSWORD" >> "$GITHUB_ENV"
      - name: Show Android signing SHA-1 fingerprint
        shell: bash
        run: |
          keytool -list -v \
            -keystore "$PHOTOSPLITTER_KEYSTORE_PATH" \
            -alias photosplitter \
            -storepass "$PHOTOSPLITTER_KEYSTORE_PASSWORD" \
            | grep -E '^[[:space:]]*SHA1:'
      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSplitter-signed-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
